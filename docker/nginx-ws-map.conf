# WebSocket 升级头映射
#
# 必须放在 http 上下文（conf.d 下的文件由 nginx.conf 的 http 块 include），
# 文件名以 00- 开头保证先于 default.conf 加载 —— server 块里引用的
# $connection_upgrade 只有在 map 已定义时才合法。
#
# 用途：站内通知走 WebSocket（${API_PREFIX}/ws）。握手不带 Upgrade 转发时，
# 表现是「永远收不到推送」且前端不报错，排查成本极高，所以单独拎成文件。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
