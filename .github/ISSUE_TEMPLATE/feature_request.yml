name: 功能建议
description: 提出一个新功能或改进建议
title: '[Feature] '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索是否已有类似建议。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 目前遇到什么不便？没有这个能力会怎样？
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望怎么实现？如果有参考实现或截图欢迎附上
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 考虑过的其他做法，以及各自的取舍
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 使用场景、影响范围等
