name: Release

# 打 tag（v*）时构建前端产物并创建 GitHub Release。
# 产物使用仓库 secrets.VITE_RSA_PUBLIC_KEY 构建；未配置时直接失败，
# 避免产出「登录必然失败」的镜像/包（公钥必须与后端私钥成对）。

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Require RSA public key
        env:
          RSA_PUB: ${{ secrets.VITE_RSA_PUBLIC_KEY }}
        run: |
          if [ -z "$RSA_PUB" ]; then
            echo "[FATAL] 未配置 secrets.VITE_RSA_PUBLIC_KEY，发布产物将无法登录" >&2
            exit 1
          fi
          echo "VITE_RSA_PUBLIC_KEY=$RSA_PUB" >> "$GITHUB_ENV"

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          cd dist
          zip -qr ../jffast-ui-dist.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: jffast-ui-dist.zip
