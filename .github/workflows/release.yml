name: Release

# 打 tag（v*）时创建 GitHub Release，**仅发布源码**。
#
# 为什么不附带 dist 包：前端构建会把 VITE_RSA_PUBLIC_KEY 写进产物，而它必须与部署方
# 后端的 RSA_PRIVATE_KEY 成对。用维护者自己的公钥构建出来的 dist 换一套后端就登录失败，
# 无法作为通用制品分发。因此 Release 不构建、不附带 dist；GitHub 会随 Release 自动提供
# 源码 zip/tar。部署方按 README「快速开始」用自己的密钥对构建。

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    name: Create Source Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
